<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 781" width="1000" height="781" role="img" aria-labelledby="t d">
<title id="t">One posting as one trace: the span tree</title>
<desc id="d">A posting is the root span. Under it: each exchange with the patron (capture hook, the Party Leader turn with its model calls, tool calls, MCP call and subagent, and the Stop hook), the dispatch of an Adventurer with its run, model calls, tool calls and the rules check, a second exchange, and the final notice. The Party Leader session is a separate trace joined to the exchanges it served by span links.</desc>
<style>
  .bg { fill: #ffffff; stroke: #d9dcd8; }
  .title { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2125; }
  .sub { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5a636b; }
  .lbl { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2125; }
  .lbl0 { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2125; }
  .tag { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5a636b; }
  .guide { stroke: #c4c9c4; stroke-width: 1; fill: none; }
  .axis { stroke: #d9dcd8; stroke-width: 1; }
  .gm { fill: #2f7d6d; }
  .hook { fill: #d08a1f; }
  .native { fill: #3f86cf; }
  .link { stroke: #7a7f86; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .zebra { fill: #f4f5f3; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c2024; stroke: #343a40; }
    .title, .lbl, .lbl0 { fill: #e3e6e8; }
    .sub, .tag { fill: #9aa3ab; }
    .guide { stroke: #4a5157; }
    .axis { stroke: #343a40; }
    .gm { fill: #4fae9a; }
    .hook { fill: #e0a548; }
    .native { fill: #6aa6e3; }
    .link { stroke: #9aa3ab; }
    .zebra { fill: #22272c; }
  }
</style>
